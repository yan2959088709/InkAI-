<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkAI · 智能小说创作系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
</head>
<body>

<!-- ============================== 顶部导航 ============================== -->
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#/">
            <i class="fas fa-feather-alt me-2"></i>
            <span class="brand-text">InkAI</span>
            <small class="brand-sub d-none d-md-inline ms-2">智能小说创作系统 · v2.2</small>
        </a>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-light" onclick="App.openCreateModal()">
                <i class="fas fa-plus me-1"></i>新建小说
            </button>
            <a class="btn btn-sm btn-outline-light" href="javascript:void(0)" onclick="App.go('#/')">
                <i class="fas fa-house me-1"></i>主页
            </a>
            <a class="btn btn-sm btn-outline-light" href="javascript:void(0)" onclick="App.go('#/genres')" title="题材库管理">
                <i class="fas fa-palette me-1"></i>题材库
            </a>
            <button class="btn btn-sm btn-outline-light" onclick="App.openTasksModal()" id="navTasksBtn"
                    title="后台任务监控">
                <i class="fas fa-tasks me-1"></i>任务
                <span class="badge bg-warning text-dark ms-1" id="navTaskBadge" style="display:none">0</span>
            </button>
        </div>
    </div>
</nav>

<!-- ============================== 主体容器 ============================== -->
<main class="main-container container-fluid px-4 py-4" id="mainContainer">
    <!-- 路由渲染入口 -->
</main>

<!-- ============================== 创建小说 模态框 ============================== -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="fas fa-magic me-2"></i>开始一本新小说</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="createForm" onsubmit="event.preventDefault(); App.submitCreate()">
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label mb-0">题材包 <span class="text-danger">*</span></label>
                <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-outline-info" onclick="App.openGenerateGenreModalFromCreate()">
                        <i class="fas fa-wand-magic-sparkles me-1"></i>LLM 造一个新题材
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="App.go('#/genres')">
                        <i class="fas fa-palette me-1"></i>题材库
                    </button>
                </div>
            </div>
            <div class="row g-3" id="genrePicker"></div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">小说标题 <span class="text-danger">*</span></label>
              <input class="form-control" id="newTitle" placeholder="例：青冥录" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">主角姓名 <span class="text-danger">*</span></label>
              <input class="form-control" id="newProtagonist" placeholder="例：顾长歌" required />
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label">总章数</label>
              <input class="form-control" type="number" id="newTotal" value="30" min="5" max="200" />
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="newAlsoStoryline" checked />
                <label class="form-check-label" for="newAlsoStoryline">
                  同时调用 LLM 展开 storyline 骨架（推荐）
                </label>
              </div>
            </div>
          </div>
          <div class="mb-2 mt-3">
            <label class="form-label">附加创作要求（可选）</label>
            <textarea class="form-control" id="newExtra" rows="3"
                      placeholder="例：希望主角是双重身份；偏向冷峻写实；强调人性灰度"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" onclick="App.submitCreate()">
          <i class="fas fa-rocket me-1"></i>开始创建
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============================== LLM 生成题材 模态框 ============================== -->
<div class="modal fade" id="genGenreModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title"><i class="fas fa-wand-magic-sparkles me-2"></i>LLM 一键造题材</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">题材描述 <span class="text-danger">*</span></label>
          <textarea class="form-control" id="genGenreDesc" rows="4"
            placeholder="例：末世废土 × 赛博侦探 — 在生化崩溃后 50 年的霓虹废都里，主角是植入芯片的前警探，靠记忆碎片回放破案，主题反人性化"></textarea>
          <div class="form-text">描述越具体，生成质量越高。可以包含：背景设定、力量体系、主角职业、风格、想要避免的东西等</div>
        </div>
        <div class="mb-3">
          <label class="form-label">建议英文名（可选）</label>
          <input class="form-control" id="genGenreName" placeholder="留空则 LLM 自己命名，如 cyber_wasteland" />
          <div class="form-text">仅小写字母 / 数字 / 下划线，2-20 字符。同名时会自动加 _2 后缀</div>
        </div>
        <div class="alert alert-info small mb-0">
          <i class="fas fa-info-circle me-1"></i>
          生成需要 30-90 秒（调一次 LLM）。完成后会跳到编辑页让你预览修改后再决定是否落盘。
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-info" onclick="App.submitGenerateGenre()">
          <i class="fas fa-rocket me-1"></i>开始生成
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============================== 任务监控 模态框 ============================== -->
<div class="modal fade" id="tasksModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-secondary text-white">
        <h5 class="modal-title"><i class="fas fa-tasks me-2"></i>后台任务监控</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="tasksModalBody"></div>
    </div>
  </div>
</div>

<!-- ============================== 全屏 Loading ============================== -->
<div id="loadingOverlay" class="loading-overlay" style="display:none">
    <div class="loading-content">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p class="text-muted" id="loadingMsg">处理中…</p>
    </div>
</div>

<!-- ============================== Toast ============================== -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index:1080"></div>

<!-- ============================== 吸底任务进度面板 ============================== -->
<div id="taskDock" class="task-dock" style="display:none">
    <div class="task-dock-inner" id="taskDockInner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
